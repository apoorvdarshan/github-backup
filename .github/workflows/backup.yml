name: Back up GitHub to GitLab
on:
  workflow_dispatch:
    inputs:
      max_deletions:
        description: Most GitLab backups of deleted GitHub repositories to delete in this run
        type: number
        default: 10
  schedule:
    - cron: '47 20 * * *'
permissions:
  contents: read
concurrency:
  group: github-to-gitlab-backup
  cancel-in-progress: false
jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check Git LFS
        run: |
          if ! git lfs version; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends git-lfs
          fi
      - name: Test backup and monitoring safeguards
        run: python3 -m unittest discover -s tests -v
      - name: Back up and verify all repositories
        run: python3 backup.py
        env:
          GITHUB_TOKEN: ${{ secrets.SOURCE_GITHUB_TOKEN }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_BACKUP_TOKEN }}
          GITHUB_OWNER: apoorvdarshan
          GITLAB_NAMESPACE_ID: '126304343'
          GITLAB_NAMESPACE_PATH: apoorvdarshan
          BACKUP_WORKERS: '2'
          BACKUP_MAX_DELETIONS: ${{ github.event.inputs.max_deletions || '10' }}
      - name: Save backup report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backup-report
          path: report.json
          retention-days: 14
          if-no-files-found: error
